<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SickofmE | 5 Track Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:'Roboto',sans-serif;
    color:white;

    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
    url("_n2.png");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    animation:bgZoom 40s ease-in-out infinite alternate;
    overflow-x:hidden;

}

@keyframes bgZoom{

    from{
        background-size:100%;
    }

    to{
        background-size:112%;
    }

}

/**********************
HEADER
**********************/

header{

    text-align:center;
    padding:60px 20px 40px;

}

header h1{

    font-family:'Oswald',sans-serif;
    font-size:4rem;
    letter-spacing:10px;
    text-transform:uppercase;

    text-shadow:
    0 0 5px crimson,
    0 0 15px crimson,
    0 0 35px red;

}

header p{

    color:#bbb;
    margin-top:15px;
    letter-spacing:4px;
    text-transform:uppercase;

}

/**********************
LAYOUT
**********************/

.container{

    width:min(1200px,95%);
    margin:auto;

    display:grid;
    grid-template-columns:400px 1fr;
    gap:40px;

    padding-bottom:120px;

}

/**********************
ARTWORK
**********************/

.album{

    position:sticky;
    top:40px;

}

.album img{

    width:100%;
    border-radius:18px;

    border:2px solid rgba(255,0,0,.25);

    box-shadow:
    0 0 30px rgba(255,0,0,.25);

    transition:.5s;

}

.album img:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 15px red,
    0 0 50px crimson,
    0 0 90px darkred;

}

/**********************
CARD
**********************/

.card{

    backdrop-filter:blur(18px);

    background:rgba(20,20,20,.72);

    border:1px solid rgba(255,0,0,.18);

    border-radius:20px;

    box-shadow:0 0 30px rgba(0,0,0,.45);

    overflow:hidden;

}

/**********************
TRACKS
**********************/

.track{

    padding:25px;

    border-bottom:1px solid rgba(255,255,255,.06);

    transition:.35s;

}

.track:last-child{

    border-bottom:none;

}

.track:hover{

    background:rgba(255,0,0,.08);

    transform:translateX(8px);

}

.trackHeader{

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;

}

.trackTitle{

    font-family:'Oswald',sans-serif;

    font-size:1.3rem;

    letter-spacing:2px;

    display:flex;
    align-items:center;
    gap:12px;

}

.trackNumber{

    color:crimson;
    font-weight:bold;
    font-size:1.1rem;

}

audio{

    width:100%;
    filter:invert(1) contrast(.95);

}

button{

    border:none;
    cursor:pointer;

    padding:10px 20px;

    border-radius:30px;

    background:#111;

    color:white;

    border:1px solid crimson;

    transition:.3s;

    font-weight:bold;

    letter-spacing:1px;

}

button:hover{

    background:crimson;

    box-shadow:
    0 0 12px crimson;

}

/**********************
SOCIALS
**********************/

.socials{

    display:flex;
    justify-content:center;
    gap:18px;

    flex-wrap:wrap;

    margin:60px 0;

}

.socials a{

    color:white;
    text-decoration:none;

    border:1px solid crimson;

    padding:12px 22px;

    border-radius:40px;

    transition:.35s;

}

.socials a:hover{

    background:crimson;

    box-shadow:
    0 0 15px crimson;

}

/**********************
LYRICS
**********************/

#lyricsPanel{

    position:fixed;

    top:0;
    right:-480px;

    width:460px;
    max-width:100%;

    height:100vh;

    background:#090909;

    border-left:2px solid crimson;

    transition:.45s;

    overflow:auto;

    padding:35px;

    z-index:100;

    box-shadow:-10px 0 30px black;

}

#lyricsPanel.active{

    right:0;

}

#lyricsPanel h2{

    font-family:'Oswald';

    letter-spacing:4px;

    margin-bottom:20px;

}

#lyricsText{

    white-space:pre-wrap;

    color:#ddd;

    line-height:1.8;

    font-size:17px;

}

.close{

    width:100%;
    margin-bottom:25px;

}

/**********************
FOOTER
**********************/

footer{

    text-align:center;

    padding:35px;

    color:#777;

    letter-spacing:2px;

}

/**********************
RESPONSIVE
**********************/

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

.album{

position:relative;
top:0;

}

header h1{

font-size:2.5rem;

letter-spacing:4px;

}

#lyricsPanel{

width:100%;
right:-100%;

}

}

</style>
</head>

<body>

<header>

<h1>SickofmE</h1>

<p>Five Track Demo</p>

</header>

<div class="container">

<div class="album">

<img src="https://i.postimg.cc/SNM5rCq9/FB-IMG-1731227945642.jpg" alt="SickofmE">

</div>

<div class="card">

<div class="track">

<div class="trackHeader">

<div class="trackTitle">
<span class="trackNumber">01</span>
AM I DEAD YET?
</div>

<button onclick="showLyrics('am i dead yet?')">Lyrics</button>

</div>

<audio controls>
<source src="sound.mp3" type="audio/mpeg">
</audio>

</div>

<div class="track">

<div class="trackHeader">

<div class="trackTitle">
<span class="trackNumber">02</span>
BAD FOR YOU
</div>

<button onclick="showLyrics('bad for you')">Lyrics</button>

</div>

<audio controls>
<source src="sound.mp3" type="audio/mpeg">
</audio>

</div>

<div class="track">

<div class="trackHeader">

<div class="trackTitle">
<span class="trackNumber">03</span>
PAPER HEART
</div>

<button onclick="showLyrics('paper heart')">Lyrics</button>

</div>

<audio controls>
<source src="sound.mp3" type="audio/mpeg">
</audio>

</div>

<div class="track">

<div class="trackHeader">

<div class="trackTitle">
<span class="trackNumber">04</span>
MY SHADOW
</div>

<button onclick="showLyrics('my shadow')">Lyrics</button>

</div>

<audio controls>
<source src="sound.mp3" type="audio/mpeg">
</audio>

</div>

<div class="track">

<div class="trackHeader">

<div class="trackTitle">
<span class="trackNumber">05</span>
IDLE HANDS
</div>

<button onclick="showLyrics('idle hands')">Lyrics</button>

</div>

<audio controls>
<source src="sound.mp3" type="audio/mpeg">
</audio>

</div>

</div>

</div>

<div class="socials">

<a href="#">YouTube</a>
<a href="#">Spotify</a>
<a href="#">Facebook</a>
<a href="#">Instagram</a>
<a href="#">Bandcamp</a>

</div>

<div id="lyricsPanel">

<button class="close" onclick="closeLyrics()">Close Lyrics</button>

<h2 id="songTitle"></h2>

<div id="lyricsText"></div>

</div>

<footer>

© 2026 SickofmE • Independent Alternative Metal

</footer>

<script>

const lyrics={

"am i dead yet?":`The sickness inside me...

(Add your full lyrics here.)`,

"bad for you":`You know I'm bad for you...

(Add lyrics here.)`,

"paper heart":`Paper heart...

(Add lyrics here.)`,

"my shadow":`My shadow...

(Add lyrics here.)`,

"idle hands":`Idle hands...

(Add lyrics here.)`

};

function showLyrics(song){

document.getElementById("songTitle").textContent=song.toUpperCase();

document.getElementById("lyricsText").textContent=lyrics[song] || "Lyrics unavailable.";

document.getElementById("lyricsPanel").classList.add("active");

}

function closeLyrics(){

document.getElementById("lyricsPanel").classList.remove("active");

}

document.addEventListener("keydown",function(e){

if(e.key==="Escape"){

closeLyrics();

}

});

</script>

</body>
</html>
